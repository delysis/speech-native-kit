name: W1 contract adapter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-adapter:
    name: W1 contracts (Rust 1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - run: ./scripts/check-w1-contract-pin.sh
      - run: cargo test --locked -p speech-native-host --features unstable-w1-contract-tests
      - run: cargo clippy --locked -p speech-native-host --all-targets --features unstable-w1-contract-tests -- -D warnings

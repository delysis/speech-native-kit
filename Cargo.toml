[workspace]
resolver = "2"
members = [
    "crates/speech-native-types",
    "crates/speech-native-router",
    "crates/speech-native-host",
    "crates/speech-native-platform",
    "crates/speech-native-backend-parakeet",
    "crates/tauri-plugin-speech-native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/delysis/speech-native-kit"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.89"
hound = "3.5.1"
parakeet-rs = "0.3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
